[Rainmeter]
Update=500
AccurateText=1
DynamicWindowSize=1
OnRefreshAction=[!SetOption MeasureTimer UpdateDivider "#RefreshDivider#"][!CommandMeasure MeasureAPI "Run"]

[Metadata]
Name=VidgetInfo Balance
Author=local
Version=1.9
Information=Compact JSON value widget. Click settings chip to edit URL/JSON. Log: @Resources\balance.log

[Variables]
W=180
H=84
FontFace=Segoe UI
IsErr=0
HasData=0
IsNum=0
Bal=0
Color=64,64,64,255
RefreshMinutes=15
RefreshDivider=15
GreenMin=30
YellowMin=15
ValueFontSize=14

[MeasureAPI]
Measure=Plugin
Plugin=RunCommand
Program=C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
Parameter=-NoProfile -NonInteractive -ExecutionPolicy Bypass -File "#CURRENTPATH#@Resources\refresh.ps1" -SettingsFile "#CURRENTPATH#@Resources\settings.txt"
State=Hide
OutputType=UTF8
OutputFile=#CURRENTPATH#last.txt
Timeout=20000
DynamicVariables=1
RegExpSubstitute=1
Substitute="\s+$":""
FinishAction=[!EnableMeasure MeasureEval][!UpdateMeasure MeasureEval][!DisableMeasure MeasureEval][!EnableMeasure MeasureTimer][!UpdateMeasure MeasureColor][!UpdateMeter *][!Redraw]

[MeasureEval]
Measure=String
String=[MeasureAPI]
DynamicVariables=1
Disabled=1
UpdateDivider=-1
IfMatchMode=1
IfMatch=^ERR:
IfMatchAction=[!SetVariable IsErr 1][!SetVariable HasData 0]
IfNotMatchAction=[!SetVariable IsErr 0][!SetVariable HasData 1][!SetVariable Bal "[MeasureAPI]"][!EnableMeasure MeasureIsNum][!UpdateMeasure MeasureIsNum][!DisableMeasure MeasureIsNum]

[MeasureIsNum]
Measure=String
String=#Bal#
DynamicVariables=1
Disabled=1
UpdateDivider=-1
IfMatchMode=1
IfMatch=^-?[0-9]+(\.[0-9]+)?$
IfMatchAction=[!SetVariable IsNum 1]
IfNotMatchAction=[!SetVariable IsNum 0]

[MeasureTimer]
Measure=Calc
Formula=1
UpdateDivider=600
Disabled=1
DynamicVariables=1
OnUpdateAction=[!CommandMeasure MeasureAPI "Run"]

[MeasureBlink]
Measure=Calc
Formula=Counter % 2

[MeasureColor]
Measure=Calc
Formula=#IsErr#
DynamicVariables=1
IfCondition=(#IsErr# = 1) && (MeasureBlink = 0)
IfTrueAction=[!SetVariable Color "192,0,0,255"][!UpdateMeter MeterBG][!Redraw]
IfCondition2=(#IsErr# = 1) && (MeasureBlink = 1)
IfTrueAction2=[!SetVariable Color "237,125,49,255"][!UpdateMeter MeterBG][!Redraw]
IfCondition3=(#IsErr# = 0) && (#HasData# = 1) && (#IsNum# = 1) && (#Bal# >= #GreenMin#)
IfTrueAction3=[!SetVariable Color "0,176,80,255"][!UpdateMeter MeterBG][!Redraw]
IfCondition4=(#IsErr# = 0) && (#HasData# = 1) && (#IsNum# = 1) && (#Bal# >= #YellowMin#) && (#Bal# < #GreenMin#)
IfTrueAction4=[!SetVariable Color "255,192,0,255"][!UpdateMeter MeterBG][!Redraw]
IfCondition5=(#IsErr# = 0) && (#HasData# = 1) && (#IsNum# = 1) && (#Bal# < #YellowMin#)
IfTrueAction5=[!SetVariable Color "192,0,0,255"][!UpdateMeter MeterBG][!Redraw]
IfCondition6=(#IsErr# = 0) && (#HasData# = 1) && (#IsNum# = 0)
IfTrueAction6=[!SetVariable Color "0,120,215,255"][!UpdateMeter MeterBG][!Redraw]
IfCondition7=(#IsErr# = 0) && (#HasData# = 0)
IfTrueAction7=[!SetVariable Color "64,64,64,255"][!UpdateMeter MeterBG][!Redraw]

[MeasureNextRefresh]
Measure=Calc
Formula=(#RefreshMinutes# = 1 ? 5 : (#RefreshMinutes# = 5 ? 15 : (#RefreshMinutes# = 15 ? 30 : (#RefreshMinutes# = 30 ? 60 : 1))))
DynamicVariables=1
Disabled=1
UpdateDivider=-1
OnUpdateAction=[!SetVariable RefreshMinutes "[MeasureNextRefresh]"][!SetVariable RefreshDivider "[MeasureNextRefresh:*120]"][!WriteKeyValue Variables RefreshMinutes "[MeasureNextRefresh]"][!WriteKeyValue Variables RefreshDivider "[MeasureNextRefresh:*120]"][!SetOption MeasureTimer UpdateDivider "[MeasureNextRefresh:*120]"][!UpdateMeter MeterRefresh][!Redraw]

[MeasurePrevRefresh]
Measure=Calc
Formula=(#RefreshMinutes# = 1 ? 60 : (#RefreshMinutes# = 5 ? 1 : (#RefreshMinutes# = 15 ? 5 : (#RefreshMinutes# = 30 ? 15 : 30))))
DynamicVariables=1
Disabled=1
UpdateDivider=-1
OnUpdateAction=[!SetVariable RefreshMinutes "[MeasurePrevRefresh]"][!SetVariable RefreshDivider "[MeasurePrevRefresh:*120]"][!WriteKeyValue Variables RefreshMinutes "[MeasurePrevRefresh]"][!WriteKeyValue Variables RefreshDivider "[MeasurePrevRefresh:*120]"][!SetOption MeasureTimer UpdateDivider "[MeasurePrevRefresh:*120]"][!UpdateMeter MeterRefresh][!Redraw]

[MeasureNextGreen]
Measure=Calc
Formula=(#GreenMin# = 20 ? 30 : (#GreenMin# = 30 ? 50 : (#GreenMin# = 50 ? 100 : 20)))
DynamicVariables=1
Disabled=1
UpdateDivider=-1
OnUpdateAction=[!SetVariable GreenMin "[MeasureNextGreen]"][!WriteKeyValue Variables GreenMin "[MeasureNextGreen]"][!UpdateMeasure MeasureColor][!UpdateMeter MeterGreen][!Redraw]

[MeasurePrevGreen]
Measure=Calc
Formula=(#GreenMin# = 20 ? 100 : (#GreenMin# = 30 ? 20 : (#GreenMin# = 50 ? 30 : 50)))
DynamicVariables=1
Disabled=1
UpdateDivider=-1
OnUpdateAction=[!SetVariable GreenMin "[MeasurePrevGreen]"][!WriteKeyValue Variables GreenMin "[MeasurePrevGreen]"][!UpdateMeasure MeasureColor][!UpdateMeter MeterGreen][!Redraw]

[MeasureNextYellow]
Measure=Calc
Formula=(#YellowMin# = 5 ? 10 : (#YellowMin# = 10 ? 15 : (#YellowMin# = 15 ? 20 : 5)))
DynamicVariables=1
Disabled=1
UpdateDivider=-1
OnUpdateAction=[!SetVariable YellowMin "[MeasureNextYellow]"][!WriteKeyValue Variables YellowMin "[MeasureNextYellow]"][!UpdateMeasure MeasureColor][!UpdateMeter MeterYellow][!Redraw]

[MeasurePrevYellow]
Measure=Calc
Formula=(#YellowMin# = 5 ? 20 : (#YellowMin# = 10 ? 5 : (#YellowMin# = 15 ? 10 : 15)))
DynamicVariables=1
Disabled=1
UpdateDivider=-1
OnUpdateAction=[!SetVariable YellowMin "[MeasurePrevYellow]"][!WriteKeyValue Variables YellowMin "[MeasurePrevYellow]"][!UpdateMeasure MeasureColor][!UpdateMeter MeterYellow][!Redraw]

[MeasureNextFont]
Measure=Calc
Formula=(#ValueFontSize# = 14 ? 16 : (#ValueFontSize# = 16 ? 18 : (#ValueFontSize# = 18 ? 20 : (#ValueFontSize# = 20 ? 24 : 14))))
DynamicVariables=1
Disabled=1
UpdateDivider=-1
OnUpdateAction=[!SetVariable ValueFontSize "[MeasureNextFont]"][!WriteKeyValue Variables ValueFontSize "[MeasureNextFont]"][!UpdateMeter MeterFont][!UpdateMeter MeterValue][!Redraw]

[MeasurePrevFont]
Measure=Calc
Formula=(#ValueFontSize# = 24 ? 20 : (#ValueFontSize# = 20 ? 18 : (#ValueFontSize# = 18 ? 16 : (#ValueFontSize# = 16 ? 14 : 24))))
DynamicVariables=1
Disabled=1
UpdateDivider=-1
OnUpdateAction=[!SetVariable ValueFontSize "[MeasurePrevFont]"][!WriteKeyValue Variables ValueFontSize "[MeasurePrevFont]"][!UpdateMeter MeterFont][!UpdateMeter MeterValue][!Redraw]

[MeterBG]
Meter=Image
W=#W#
H=#H#
SolidColor=#Color#
DynamicVariables=1
LeftMouseUpAction=[!CommandMeasure MeasureAPI "Run"]

[MeterLabel]
Meter=String
X=10
Y=4
W=160
H=14
FontFace=#FontFace#
FontSize=10
FontColor=255,255,255,255
AntiAlias=1
StringAlign=Left
Text=VidgetInfoBalance
LeftMouseUpAction=["www"]

[MeterValue]
Meter=String
MeasureName=MeasureAPI
X=90
Y=26
W=180
H=28
FontFace=#FontFace#
FontSize=#ValueFontSize#
FontColor=255,255,255,255
AntiAlias=1
StringAlign=CenterCenter
ClipString=2
ClipStringW=160
ClipStringH=28
Text=[MeasureAPI]
DynamicVariables=1
ToolTipText=[MeasureAPI]
ToolTipHidden=0

[MeterRefresh]
Meter=String
X=22
Y=56
W=45
H=14
FontFace=#FontFace#
FontSize=8
FontColor=255,255,255,220
AntiAlias=1
StringAlign=CenterCenter
Text=#RefreshMinutes#m
DynamicVariables=1
MouseActionCursor=1
LeftMouseUpAction=[!EnableMeasure MeasureNextRefresh][!UpdateMeasure MeasureNextRefresh][!DisableMeasure MeasureNextRefresh]
RightMouseUpAction=[!EnableMeasure MeasurePrevRefresh][!UpdateMeasure MeasurePrevRefresh][!DisableMeasure MeasurePrevRefresh]

[MeterGreen]
Meter=String
X=67
Y=56
W=45
H=14
FontFace=#FontFace#
FontSize=8
FontColor=255,255,255,220
AntiAlias=1
StringAlign=CenterCenter
Text=G#GreenMin#
DynamicVariables=1
MouseActionCursor=1
LeftMouseUpAction=[!EnableMeasure MeasureNextGreen][!UpdateMeasure MeasureNextGreen][!DisableMeasure MeasureNextGreen]
RightMouseUpAction=[!EnableMeasure MeasurePrevGreen][!UpdateMeasure MeasurePrevGreen][!DisableMeasure MeasurePrevGreen]

[MeterYellow]
Meter=String
X=112
Y=56
W=45
H=14
FontFace=#FontFace#
FontSize=8
FontColor=255,255,255,220
AntiAlias=1
StringAlign=CenterCenter
Text=Y#YellowMin#
DynamicVariables=1
MouseActionCursor=1
LeftMouseUpAction=[!EnableMeasure MeasureNextYellow][!UpdateMeasure MeasureNextYellow][!DisableMeasure MeasureNextYellow]
RightMouseUpAction=[!EnableMeasure MeasurePrevYellow][!UpdateMeasure MeasurePrevYellow][!DisableMeasure MeasurePrevYellow]

[MeterFont]
Meter=String
X=157
Y=56
W=45
H=14
FontFace=#FontFace#
FontSize=8
FontColor=255,255,255,220
AntiAlias=1
StringAlign=CenterCenter
Text=#ValueFontSize#
DynamicVariables=1
MouseActionCursor=1
LeftMouseUpAction=[!EnableMeasure MeasureNextFont][!UpdateMeasure MeasureNextFont][!DisableMeasure MeasureNextFont]
RightMouseUpAction=[!EnableMeasure MeasurePrevFont][!UpdateMeasure MeasurePrevFont][!DisableMeasure MeasurePrevFont]

[MeterCfg]
Meter=String
X=90
Y=70
W=180
H=13
FontFace=#FontFace#
FontSize=8
FontColor=255,255,255,200
AntiAlias=1
StringAlign=CenterCenter
ClipString=1
Text=settings
DynamicVariables=1
MouseActionCursor=1
ToolTipText=Edit url / json / err in settings.txt
LeftMouseUpAction=["notepad.exe" "#CURRENTPATH#@Resources\settings.txt"]
